<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 132 Jeopardy | CompTIA A+ Core 1 Hardware</title>
<style>
  :root {
    --navy: #002855;
    --blue: #0062A3;
    --gold: #F7DD63;
    --ink: #ffffff;
    --good: #2e9e5b;
    --bad: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: #001a38;
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: var(--navy);
    border-bottom: 4px solid var(--blue);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.4rem; color: var(--gold); letter-spacing: .5px; }
  header small { color: #cfe3f5; display: block; font-weight: normal; font-size: .8rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: inherit;
    cursor: pointer;
    border: 2px solid var(--gold);
    background: var(--blue);
    color: var(--gold);
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
  }
  button:hover:not(:disabled) { background: var(--gold); color: var(--navy); }
  button:focus-visible, .cell:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  button:disabled { cursor: default; }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }

  /* Scoreboard (single player) */
  #scoreboard {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
  }
  .stat {
    flex: 1 1 160px;
    background: var(--navy);
    border: 3px solid var(--blue);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat.main { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(247,221,99,.25); }
  .stat .label { color: #9fc4e6; font-size: .8rem; text-transform: uppercase; letter-spacing: 1px; }
  .stat .val { font-size: 1.9rem; font-weight: 700; color: var(--gold); margin-top: 2px; }

  /* Board */
  #board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .cat {
    background: var(--blue);
    color: var(--gold);
    text-align: center;
    font-weight: 700;
    text-transform: uppercase;
    padding: 14px 6px;
    display: flex; align-items: center; justify-content: center;
    min-height: 74px;
    font-size: clamp(.7rem, 1.5vw, 1rem);
    border: 3px solid var(--navy);
    border-radius: 4px;
  }
  .cell {
    background: var(--navy);
    color: var(--gold);
    border: 3px solid var(--blue);
    border-radius: 4px;
    font-size: clamp(1.1rem, 3vw, 2rem);
    font-weight: 800;
    min-height: 84px;
    display: flex; align-items: center; justify-content: center;
  }
  .cell:hover:not(:disabled) { background: var(--blue); color: var(--gold); }
  .cell.used { background: #00122a; border-color: #0a2a4d; color: transparent; }
  .cell.used:hover { background: #00122a; }
  .cell.hit { box-shadow: inset 0 0 0 3px var(--good); }
  .cell.miss { box-shadow: inset 0 0 0 3px var(--bad); }

  /* Clue overlay */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0, 12, 30, .94);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--navy);
    border: 4px solid var(--gold);
    border-radius: 10px;
    width: min(900px, 100%);
    padding: 28px;
    text-align: center;
    max-height: 95vh;
    overflow: auto;
  }
  .card .meta { color: #9fc4e6; font-size: .95rem; text-transform: uppercase; letter-spacing: 1px; }
  .card .clue { font-size: clamp(1.2rem, 3vw, 2rem); line-height: 1.35; margin: 18px 0; text-transform: uppercase; }
  #timerBar { height: 8px; background: #0a2a4d; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  #timerFill { height: 100%; width: 100%; background: var(--gold); transition: width 1s linear; }
  #timerFill.low { background: var(--bad); }
  #timerText { color: #cfe3f5; font-size: .85rem; margin-top: 4px; }

  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 14px; }
  .choice {
    text-align: left;
    padding: 14px 16px;
    font-size: clamp(.95rem, 2vw, 1.15rem);
    background: var(--blue);
    border: 2px solid var(--gold);
    color: #fff;
    display: flex; gap: 10px; align-items: baseline;
  }
  .choice .letter { color: var(--gold); font-weight: 800; }
  .choice:hover:not(:disabled) { background: var(--gold); color: var(--navy); }
  .choice:hover:not(:disabled) .letter { color: var(--navy); }
  .choice:disabled { opacity: 1; }
  .choice.correct { background: var(--good); border-color: #bff0d1; color: #fff; }
  .choice.correct .letter { color: #fff; }
  .choice.wrong { background: var(--bad); border-color: #ffc9c2; color: #fff; }
  .choice.wrong .letter { color: #fff; }
  .choice.dim { opacity: .45; }

  #feedback { min-height: 1.6em; font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
  #feedback.good { color: #bff0d1; }
  #feedback.bad { color: #ffc9c2; }
  #answerText {
    display: none;
    font-size: clamp(1.05rem, 2.4vw, 1.4rem);
    color: var(--gold);
    background: rgba(0,98,163,.35);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
  }
  #answerText.show { display: block; }
  #continueBtn { display: none; }
  #continueBtn.show { display: inline-block; }

  /* End screen */
  #endScreen {
    display: none;
    text-align: center;
    background: var(--navy);
    border: 4px solid var(--gold);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 14px;
  }
  #endScreen.show { display: block; }
  #endScreen h2 { margin: 0 0 10px; color: var(--gold); font-size: 1.8rem; }
  #endScreen .big { font-size: 2.6rem; font-weight: 800; color: var(--gold); }
  #endScreen p { margin: 6px 0; color: #cfe3f5; }
  #endScreen .newrec { color: #bff0d1; font-weight: 700; }
  #endScreen button { margin-top: 14px; font-size: 1.1rem; padding: 10px 22px; }

  footer { text-align: center; color: #7fa6c9; font-size: .8rem; padding: 18px; }

  @media (max-width: 720px) {
    #board { gap: 4px; }
    .cell { min-height: 60px; }
    .cat { min-height: 60px; padding: 8px 3px; }
    #choices { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { #timerFill { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Module 132 Jeopardy
    <small>CompTIA A+ Core 1 (220-1201) &middot; Hardware Break/Fix</small>
  </h1>
  <div class="controls">
    <button id="resetBtn" type="button">New Game</button>
  </div>
</header>

<main>
  <section id="endScreen" role="status" aria-live="polite"></section>
  <section id="scoreboard" aria-label="Scoreboard">
    <div class="stat main"><div class="label">Score</div><div class="val" id="scoreVal">$0</div></div>
    <div class="stat"><div class="label">High Score (this session)</div><div class="val" id="highVal">$0</div></div>
    <div class="stat"><div class="label">Clues Left</div><div class="val" id="leftVal">30</div></div>
  </section>
  <section id="board" aria-label="Jeopardy board"></section>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="clueText">
  <div class="card">
    <div class="meta" id="clueMeta"></div>
    <div id="timerBar" aria-hidden="true"><div id="timerFill"></div></div>
    <div id="timerText" aria-live="off"></div>
    <div class="clue" id="clueText"></div>
    <div id="choices" role="group" aria-label="Answer choices"></div>
    <div id="feedback" role="status" aria-live="assertive"></div>
    <div id="answerText"></div>
    <button id="continueBtn" type="button">Back to Board</button>
  </div>
</div>

<footer>Clues sourced from the Module 132 lesson set. Click a tile, then click your answer. The high score resets when the page reloads.</footer>

<script>
/* ---------- Clue data (from module132_jeopardy_board.csv) ---------- */
const CLUES = [
  /* ---------- CATEGORY 1: TROUBLESHOOTING METHODOLOGY ---------- */
  {"c":"Troubleshooting Methodology","v":100,"q":"This is the first step of the CompTIA troubleshooting methodology.","a":"What is identify the problem?","l":"132.1"},
  {"c":"Troubleshooting Methodology","v":200,"q":"This is the second step of the CompTIA troubleshooting methodology, where you establish a working hypothesis.","a":"What is establish a theory of probable cause?","l":"132.1"},
  {"c":"Troubleshooting Methodology","v":300,"q":"This is the third step of the CompTIA troubleshooting methodology, which involves validating your hypothesis.","a":"What is test the theory to determine cause?","l":"132.1"},
  {"c":"Troubleshooting Methodology","v":400,"q":"This is the fourth step of the CompTIA troubleshooting methodology, where you execute the fix or escalate.","a":"What is establish a plan of action to resolve the problem and implement the solution?","l":"132.1"},
  {"c":"Troubleshooting Methodology","v":500,"q":"This is the sixth and final step of the CompTIA troubleshooting methodology, crucial for future support references.","a":"What is document findings, actions, and outcomes?","l":"132.1"},

  /* ---------- CATEGORY 2: PC COMPONENTS ---------- */
  {"c":"PC Components","v":100,"q":"This high-end RAM feature prevents system crashes and data corruption by identifying and fixing single-bit errors.","a":"What is ECC (Error-Correcting Code) memory?","l":"132.2"},
  {"c":"PC Components","v":200,"q":"This latest standard desktop RAM architecture uses 288 pins and integrates power management directly onto the module stick.","a":"What is DDR5?","l":"132.2"},
  {"c":"PC Components","v":300,"q":"This baseline full-sized consumer motherboard form factor typically measures 12 by 9.6 inches.","a":"What is Standard ATX?","l":"132.2"},
  {"c":"PC Components","v":400,"q":"This chemical compound must be reapplied cleanly in a pea-sized amount whenever a technician reseats a CPU heatsink.","a":"What is thermal paste (or thermal compound)?","l":"132.2"},
  {"c":"PC Components","v":500,"q":"An unexpected system reboot or shutdown during heavy 3D rendering or gaming usually points to a deficit in this component.","a":"What is the PSU (Power Supply Unit)?","l":"132.2"},

  /* ---------- CATEGORY 3: HARDWARE STORAGE ---------- */
  {"c":"Hardware Storage","v":100,"q":"This small, flat form-factor SSD style communicates directly over the high-speed PCIe bus to bypass the legacy SATA bottleneck.","a":"What is M.2 NVMe?","l":"132.3"},
  {"c":"Hardware Storage","v":200,"q":"This specific array tier requires at least 3 drives and balances fault tolerance with storage capacity using distributed parity.","a":"What is RAID 5?","l":"132.3"},
  {"c":"Hardware Storage","v":300,"q":"This is the maximum theoretical interface speed limit of a standard third-generation SATA III connection cable.","a":"What is 6.0 Gbps?","l":"132.3"},
  {"c":"Hardware Storage","v":400,"q":"This classic RAID tier mirrors data across an even number of disks, providing high fault tolerance but cutting net capacity by 50%.","a":"What is RAID 1?","l":"132.3"},
  {"c":"Hardware Storage","v":500,"q":"This physical size standard is the most common form factor for mechanical laptop hard drives and baseline internal SATA SSDs.","a":"What is 2.5 inches?","l":"132.3"},

  /* ---------- CATEGORY 4: NETWORKING HARDWARE ---------- */
  {"c":"Networking Hardware","v":100,"q":"Operating at Layer 2 of the OSI model, this device forwards network traffic frames dynamically based on physical MAC addresses.","a":"What is an Ethernet Switch?","l":"132.4"},
  {"c":"Networking Hardware","v":200,"q":"This legacy network infrastructure device operates at Layer 1 and blindly broadcasts incoming electrical data out to all active ports.","a":"What is a Hub?","l":"132.4"},
  {"c":"Networking Hardware","v":300,"q":"This twisted-pair copper cable standard natively handles up to 10 Gbps speeds, but is limited to a maximum run distance of 55 meters.","a":"What is Category 6 (Cat6)?","l":"132.4"},
  {"c":"Networking Hardware","v":400,"q":"This high-frequency wireless standard is known as Wi-Fi 6 and implements OFDMA for optimization across dense multi-device environments.","a":"What is 802.11ax?","l":"132.4"},
  {"c":"Networking Hardware","v":500,"q":"This specific coaxial cable standard features a heavy copper core and is the common path for high-bandwidth commercial cable drops.","a":"What is RG-6?","l":"132.4"},

  /* ---------- CATEGORY 5: MOBILE DEVICES ---------- */
  {"c":"Mobile Devices","v":100,"q":"This emissive screen tech draws zero power for true black pixels because the individual organic diodes switch off completely.","a":"What is OLED?","l":"132.5"},
  {"c":"Mobile Devices","v":200,"q":"A bulging mobile case accompanied by a screen separating from its chassis indicates a critical hazard with this component.","a":"What is a swollen Lithium-Ion battery?","l":"132.5"},
  {"c":"Mobile Devices","v":300,"q":"This clear glass layer sits on top of modern mobile displays to read gestures and touch inputs, converting them to coordinate signals.","a":"What is the Digitizer?","l":"132.5"},
  {"c":"Mobile Devices","v":400,"q":"This device uses micro-machined internal hardware structures to measure orientation, tilting, and physical rotation axis changes.","a":"What is a Gyroscope?","l":"132.5"},
  {"c":"Mobile Devices","v":500,"q":"This older mobile display peripheral component is responsible for stepping up DC voltages to power legacy CCFL matrix backlights.","a":"What is a Display Inverter?","l":"132.5"},

  /* ---------- CATEGORY 6: CORE DIAGNOSTICS ---------- */
  {"c":"Core Diagnostics","v":100,"q":"When a system drops power before a display renders, these acoustic motherboard speaker patterns signal what internal component failed POST.","a":"What are Beep Codes?","l":"132.6"},
  {"c":"Core Diagnostics","v":200,"q":"This integrated firmware interface handles raw hardware checks immediately after power-on sequence and passes off control to the OS loader.","a":"What is the POST (Power-On Self-Test)?","l":"132.6"},
  {"c":"Core Diagnostics","v":300,"q":"If a motherboard repeatedly loses its custom system clock settings every time the computer is unplugged, this component needs swapping.","a":"What is the CMOS coin-cell battery?","l":"132.6"},
  {"c":"Core Diagnostics","v":400,"q":"This physical looping adapter is used by network techs to test internal network ports by bouncing output lines straight back into input lines.","a":"What is a Loopback Plug?","l":"132.6"},
  {"c":"Core Diagnostics","v":500,"q":"This multi-meter assessment mode checks if an electrical current can travel end-to-end along a single continuous path without breaks.","a":"What is a Continuity Test?","l":"132.6"}
];
/* ---------- State ---------- */
const TIMER_SECONDS = 30;
const CHOICE_COUNT = 4;
const LETTERS = ["A", "B", "C", "D"];
const state = {
  score: 0,
  high: 0,          /* session-only: lives in memory, never written to storage */
  used: new Set(),
  current: null,    /* { cl, cell, locked } */
  timer: null,
  left: TIMER_SECONDS
};

const $ = id => document.getElementById(id);
const categories = [...new Set(CLUES.map(x => x.c))];
const values = [...new Set(CLUES.map(x => x.v))].sort((a, b) => a - b);

function clueFor(cat, val) { return CLUES.find(x => x.c === cat && x.v === val); }
function keyOf(cl) { return cl.c + "|" + cl.v; }
function fmt(n) { return "$" + n.toLocaleString(); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
/* "What is the TPM (Trusted Platform Module)?" -> "The TPM (Trusted Platform Module)" */
function cleanAnswer(a) {
  let t = a.replace(/^What (is|are)\s+/i, "").replace(/\?$/, "").trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/* Distractors: other answers from the same category first, then the rest of the pool. */
function buildChoices(cl) {
  const correct = cleanAnswer(cl.a);
  const seen = new Set([correct.toLowerCase()]);
  const pick = [];
  const take = list => {
    for (const x of shuffle(list)) {
      if (pick.length >= CHOICE_COUNT - 1) return;
      const t = cleanAnswer(x.a);
      if (!seen.has(t.toLowerCase())) { seen.add(t.toLowerCase()); pick.push(t); }
    }
  };
  take(CLUES.filter(x => x.c === cl.c && x !== cl));
  take(CLUES.filter(x => x.c !== cl.c));
  return shuffle([{ text: correct, ok: true }, ...pick.map(t => ({ text: t, ok: false }))]);
}

/* ---------- Scoreboard ---------- */
function renderStats() {
  $("scoreVal").textContent = fmt(state.score);
  $("highVal").textContent = fmt(state.high);
  $("leftVal").textContent = String(CLUES.length - state.used.size);
}

/* ---------- Board ---------- */
function buildBoard() {
  const b = $("board");
  b.innerHTML = "";
  b.style.gridTemplateColumns = "repeat(" + categories.length + ", 1fr)";
  categories.forEach(c => {
    const h = document.createElement("div");
    h.className = "cat"; h.textContent = c; h.setAttribute("role", "columnheader");
    b.appendChild(h);
  });
  values.forEach(v => {
    categories.forEach(c => {
      const cl = clueFor(c, v);
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      cell.dataset.key = keyOf(cl);
      cell.textContent = "$" + v;
      cell.setAttribute("aria-label", c + " for " + v + " dollars");
      cell.addEventListener("click", () => openClue(cl, cell));
      b.appendChild(cell);
    });
  });
}

/* ---------- Clue overlay ---------- */
function openClue(cl, cell) {
  if (state.used.has(keyOf(cl)) || state.current) return;
  state.current = { cl, cell, locked: false };
  $("clueMeta").textContent = cl.c + " \u2022 $" + cl.v + " \u2022 Lesson " + cl.l;
  $("clueText").textContent = cl.q;
  $("feedback").textContent = "";
  $("feedback").className = "";
  $("answerText").classList.remove("show");
  $("continueBtn").classList.remove("show");

  const box = $("choices");
  box.innerHTML = "";
  buildChoices(cl).forEach((ch, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.dataset.ok = ch.ok ? "1" : "0";
    const l = document.createElement("span"); l.className = "letter"; l.textContent = LETTERS[i] + ".";
    const t = document.createElement("span"); t.textContent = ch.text;
    b.append(l, t);
    b.addEventListener("click", () => choose(b));
    box.appendChild(b);
  });

  $("overlay").classList.add("show");
  startTimer();
}

function lockChoices(pickedBtn) {
  [...$("choices").children].forEach(b => {
    b.disabled = true;
    if (b.dataset.ok === "1") b.classList.add("correct");
    else if (b === pickedBtn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
}

function finishClue(result, pickedBtn) {
  const cur = state.current;
  if (!cur || cur.locked) return;
  cur.locked = true;
  stopTimer();
  lockChoices(pickedBtn || null);

  const fb = $("feedback");
  if (result === "hit") {
    state.score += cur.cl.v;
    if (state.score > state.high) state.high = state.score;
    fb.textContent = "Correct! +" + fmt(cur.cl.v);
    fb.className = "good";
    cur.cell.classList.add("hit");
  } else if (result === "miss") {
    fb.textContent = "Not quite. No points lost.";
    fb.className = "bad";
    cur.cell.classList.add("miss");
  } else {
    fb.textContent = "Time's up. No points lost.";
    fb.className = "bad";
    cur.cell.classList.add("miss");
  }
  $("answerText").textContent = cur.cl.a;
  $("answerText").classList.add("show");
  $("continueBtn").classList.add("show");
  $("continueBtn").textContent = (state.used.size + 1 >= CLUES.length) ? "See Final Score" : "Back to Board";
  $("continueBtn").focus();
  renderStats();
}

function choose(btn) {
  if (!state.current || state.current.locked) return;
  finishClue(btn.dataset.ok === "1" ? "hit" : "miss", btn);
}

function closeClue() {
  const cur = state.current;
  if (!cur || !cur.locked) return;   /* a clue must be answered or time out */
  stopTimer();
  state.used.add(keyOf(cur.cl));
  cur.cell.classList.add("used");
  cur.cell.disabled = true;
  cur.cell.setAttribute("aria-label", "Used");
  state.current = null;
  $("overlay").classList.remove("show");
  renderStats();
  checkEnd();
}

/* ---------- Timer ---------- */
function startTimer() {
  stopTimer();
  state.left = TIMER_SECONDS;
  paintTimer();
  state.timer = setInterval(() => {
    state.left--;
    paintTimer();
    if (state.left <= 0) { finishClue("timeout", null); }
  }, 1000);
}
function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
function paintTimer() {
  const f = $("timerFill");
  f.style.width = Math.max(0, (state.left / TIMER_SECONDS) * 100) + "%";
  f.classList.toggle("low", state.left <= 8);
  $("timerText").textContent = Math.max(0, state.left) + "s";
}

/* ---------- End of game ---------- */
function checkEnd() {
  if (state.used.size < CLUES.length) return;
  const maxScore = CLUES.reduce((s, c) => s + c.v, 0);
  const e = $("endScreen");
  e.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = "Board Cleared!";
  const big = document.createElement("div"); big.className = "big"; big.textContent = fmt(state.score);
  const of = document.createElement("p"); of.textContent = "out of " + fmt(maxScore) + " possible";
  const hi = document.createElement("p"); hi.textContent = "High score this session: " + fmt(state.high);
  e.append(h, big, of, hi);
  if (state.score > 0 && state.score === state.high) {
    const rec = document.createElement("p"); rec.className = "newrec"; rec.textContent = "That's your best run this session.";
    e.append(rec);
  }
  const again = document.createElement("button");
  again.type = "button"; again.id = "playAgainBtn"; again.textContent = "New Game";
  again.addEventListener("click", newGame);
  e.append(again);
  e.classList.add("show");
  again.focus();
}

/* ---------- Wiring ---------- */
function newGame() {
  stopTimer();
  state.score = 0;
  state.used.clear();
  state.current = null;
  $("overlay").classList.remove("show");
  $("endScreen").classList.remove("show");
  buildBoard();
  renderStats();
}
$("continueBtn").addEventListener("click", closeClue);
$("resetBtn").addEventListener("click", () => {
  if (state.used.size === 0 && !state.current) { newGame(); return; }
  if (confirm("Start a new game? Your current score will reset (the session high score is kept).")) newGame();
});

newGame();
</script>
</body>
</html>
