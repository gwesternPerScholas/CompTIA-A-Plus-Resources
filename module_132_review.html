<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 132 Review - CompTIA A+</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success-green: #22c55e;
      --error-red: #ef4444;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .aplus-container {
      width: 100%;
      max-width: 850px;
      margin: 20px auto;
      padding: 2.5rem;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    /* Header Navigation */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-blue);
      background-color: rgba(56, 189, 248, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    /* Tab Navigation */
    .nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
      gap: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 3px solid transparent;
      border-radius: 6px 6px 0 0;
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.08);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent-blue), #0284c7);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* Section 1: Flashcard Deck */
    .slide-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 35px;
      text-align: center;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .slide-term {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent-blue);
      margin-bottom: 15px;
    }

    .slide-def {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .slide-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .slide-counter {
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Section 2: Matching Game */
    .matching-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    .match-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-item {
      padding: 14px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .match-item:hover {
      border-color: var(--accent-blue);
    }

    .match-item.selected {
      border-color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.15);
      font-weight: 600;
    }

    .match-item.matched {
      border-color: var(--success-green);
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      cursor: default;
      opacity: 0.85;
    }

    /* Section 3: Quiz */
    .quiz-question {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.5;
      color: var(--text-main);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-option-btn {
      padding: 14px;
      text-align: left;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .quiz-option-btn:hover:not(:disabled) {
      border-color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.1);
    }

    .quiz-option-btn.correct {
      background: rgba(34, 197, 94, 0.2) !important;
      border-color: var(--success-green) !important;
      color: #86efac;
      font-weight: bold;
    }

    .quiz-option-btn.incorrect {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--error-red) !important;
      color: #fca5a5;
    }

    .quiz-feedback {
      margin-top: 15px;
      font-weight: 600;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .quiz-footer {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quiz-score {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .matching-board {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="aplus-container">
  <!-- Top Navigation Header -->
  <div class="top-header">
    <a href="index.html" class="back-btn">
      &larr; Return to Main Page
    </a>
    <span class="badge">CompTIA A+ (220-1201 / 220-1202)</span>
  </div>

  <h1>Module 132: Technical Review</h1>
  <p class="subtitle">Review core concepts, practice matching terms, and test your knowledge before moving on.</p>

  <!-- Tab Navigation -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('review', event)">1. Flashcard Deck</button>
    <button class="tab-btn" onclick="switchTab('matching', event)">2. Matching Game</button>
    <button class="tab-btn" onclick="switchTab('quiz', event)">3. Module Quiz</button>
  </div>

  <!-- Tab 1: Slideshow Review -->
  <div id="tab-review" class="tab-content active">
    <div class="slide-card">
      <div id="slide-term" class="slide-term">Loading...</div>
      <div id="slide-def" class="slide-def"></div>
    </div>
    <div class="slide-controls">
      <button class="btn" onclick="prevSlide()">Previous</button>
      <span id="slide-counter" class="slide-counter">1 / 5</span>
      <button class="btn" onclick="nextSlide()">Next</button>
    </div>
  </div>

  <!-- Tab 2: Matching Game -->
  <div id="tab-matching" class="tab-content">
    <p style="margin-top: 0; color: var(--text-muted);">Select a term on the left, then select its matching definition on the right.</p>
    <div class="matching-board">
      <div class="match-column" id="terms-column"></div>
      <div class="match-column" id="defs-column"></div>
    </div>
    <div style="margin-top: 20px; text-align: right;">
      <button class="btn" onclick="initMatchingGame()">Reset Game</button>
    </div>
  </div>

  <!-- Tab 3: Quiz -->
  <div id="tab-quiz" class="tab-content">
    <div id="quiz-container">
      <div id="quiz-question" class="quiz-question"></div>
      <div id="quiz-options" class="quiz-options"></div>
      <div id="quiz-feedback" class="quiz-feedback"></div>
      <div class="quiz-footer">
        <span id="quiz-score" class="quiz-score">Score: 0 / 0</span>
        <button class="btn" onclick="nextQuestion()">Next Question</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Core CompTIA A+ Dataset for Module 132
  const resourceData = [
    {
      id: 1,
      term: "DHCP (Ports 67/68)",
      def: "Dynamically assigns IP addresses, subnet masks, default gateways, and DNS server details to network clients.",
      distractors: ["Translates domain names into IP addresses.", "Encrypts web traffic using SSL/TLS.", "Provides secure command-line remote access."]
    },
    {
      id: 2,
      term: "DNS (Port 53)",
      def: "Resolves human-readable domain names (e.g., perscholas.org) into IP addresses.",
      distractors: ["Automatically assigns IP address settings.", "Transfers files over an unencrypted network.", "Monitors network devices using SNMP."]
    },
    {
      id: 3,
      term: "APIPA Address",
      def: "A self-assigned IP address in the 169.254.0.0/16 range used when a DHCP server is unreachable.",
      distractors: ["A public IP address assigned directly by an ISP.", "A loopback address (127.0.0.1) used for testing.", "A private IPv6 link-local address starting with fe80::."]
    },
    {
      id: 4,
      term: "Port 3389 (RDP)",
      def: "Remote Desktop Protocol - allows graphical interface access to a remote Windows system.",
      distractors: ["Secure Shell (SSH) protocol for remote command-line access.", "Encrypted web browsing port.", "Server Message Block (SMB) for file sharing."]
    },
    {
      id: 5,
      term: "SATA III Speed",
      def: "Provides a maximum theoretical throughput of 6.0 Gbps (approx. 600 MB/s).",
      distractors: ["Maximum throughput of 1.5 Gbps.", "Maximum throughput of 10.0 Gbps.", "Maximum throughput of 3.0 Gbps."]
    }
  ];

  /* Tab Navigation */
  function switchTab(tabName, event) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    document.getElementById(`tab-${tabName}`).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  /* 1. Slideshow Logic */
  let currentSlide = 0;

  function renderSlide() {
    const item = resourceData[currentSlide];
    document.getElementById('slide-term').innerText = item.term;
    document.getElementById('slide-def').innerText = item.def;
    document.getElementById('slide-counter').innerText = `${currentSlide + 1} / ${resourceData.length}`;
  }

  function nextSlide() {
    currentSlide = (currentSlide + 1) % resourceData.length;
    renderSlide();
  }

  function prevSlide() {
    currentSlide = (currentSlide - 1 + resourceData.length) % resourceData.length;
    renderSlide();
  }

  /* 2. Matching Game Logic */
  let selectedTerm = null;
  let selectedDef = null;

  function initMatchingGame() {
    const termsCol = document.getElementById('terms-column');
    const defsCol = document.getElementById('defs-column');
    termsCol.innerHTML = '';
    defsCol.innerHTML = '';

    const shuffledTerms = [...resourceData].sort(() => Math.random() - 0.5);
    const shuffledDefs = [...resourceData].sort(() => Math.random() - 0.5);

    shuffledTerms.forEach(item => {
      const el = document.createElement('div');
      el.className = 'match-item';
      el.innerText = item.term;
      el.dataset.id = item.id;
      el.onclick = () => selectMatchItem(el, 'term');
      termsCol.appendChild(el);
    });

    shuffledDefs.forEach(item => {
      const el = document.createElement('div');
      el.className = 'match-item';
      el.innerText = item.def;
      el.dataset.id = item.id;
      el.onclick = () => selectMatchItem(el, 'def');
      defsCol.appendChild(el);
    });
  }

  function selectMatchItem(el, type) {
    if (el.classList.contains('matched')) return;

    if (type === 'term') {
      document.querySelectorAll('#terms-column .match-item').forEach(i => i.classList.remove('selected'));
      selectedTerm = el;
    } else {
      document.querySelectorAll('#defs-column .match-item').forEach(i => i.classList.remove('selected'));
      selectedDef = el;
    }
    el.classList.add('selected');

    if (selectedTerm && selectedDef) {
      if (selectedTerm.dataset.id === selectedDef.dataset.id) {
        selectedTerm.classList.add('matched');
        selectedDef.classList.add('matched');
        selectedTerm.classList.remove('selected');
        selectedDef.classList.remove('selected');
      } else {
        setTimeout(() => {
          if (selectedTerm) selectedTerm.classList.remove('selected');
          if (selectedDef) selectedDef.classList.remove('selected');
        }, 400);
      }
      selectedTerm = null;
      selectedDef = null;
    }
  }

  /* 3. Quiz Logic */
  let currentQuizIndex = 0;
  let score = 0;
  let totalAttempted = 0;

  function renderQuizQuestion() {
    const q = resourceData[currentQuizIndex];
    document.getElementById('quiz-question').innerText = `Question ${currentQuizIndex + 1}: What is the primary function or definition of "${q.term}"?`;
    
    const feedbackEl = document.getElementById('quiz-feedback');
    feedbackEl.innerText = '';
    feedbackEl.style.background = 'none';

    const optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';

    const allOptions = [q.def, ...q.distractors].sort(() => Math.random() - 0.5);

    allOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'quiz-option-btn';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(btn, opt, q.def);
      optionsContainer.appendChild(btn);
    });

    document.getElementById('quiz-score').innerText = `Score: ${score} / ${totalAttempted}`;
  }

  function checkAnswer(selectedBtn, selectedText, correctText) {
    const buttons = document.querySelectorAll('.quiz-option-btn');
    buttons.forEach(btn => btn.disabled = true);

    totalAttempted++;
    const feedbackEl = document.getElementById('quiz-feedback');

    if (selectedText === correctText) {
      selectedBtn.classList.add('correct');
      feedbackEl.innerText = "✓ Correct!";
      feedbackEl.style.color = "#86efac";
      feedbackEl.style.background = "rgba(34, 197, 94, 0.15)";
      score++;
    } else {
      selectedBtn.classList.add('incorrect');
      feedbackEl.innerText = `✕ Incorrect. The correct answer is: ${correctText}`;
      feedbackEl.style.color = "#fca5a5";
      feedbackEl.style.background = "rgba(239, 68, 68, 0.15)";
      buttons.forEach(btn => {
        if (btn.innerText === correctText) btn.classList.add('correct');
      });
    }

    document.getElementById('quiz-score').innerText = `Score: ${score} / ${totalAttempted}`;
  }

  function nextQuestion() {
    currentQuizIndex = (currentQuizIndex + 1) % resourceData.length;
    renderQuizQuestion();
  }

  // Initial load
  renderSlide();
  initMatchingGame();
  renderQuizQuestion();
</script>
</body>
</html>
